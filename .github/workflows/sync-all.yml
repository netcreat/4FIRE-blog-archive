name: Sync Naver + Substack Status

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "substack_manifest.json"
      - ".github/SYNC_ALL_TRIGGER.txt"

  schedule:
    # Keep Naver and Substack status together on the same 3-hour cadence.
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-naver-substack-status
  cancel-in-progress: true

jobs:
  sync-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 markdownify

      - name: Validate Python scripts
        run: |
          python -m py_compile sync_naver.py
          python -m py_compile generate_substack_status.py

      - name: Sync Naver Blog
        run: |
          python sync_naver.py

      - name: Update Substack Status
        run: |
          python generate_substack_status.py

      - name: Commit all generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml index.json posts/ SUBSTACK_STATUS.md substack_status.json substack_manifest.json

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Sync Naver blog and update Substack status"

          # Reduce push conflicts if another repository update landed during the run.
          git pull --rebase origin main
          git push origin main

name: Update Substack Status

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "index.json"
      - "substack_manifest.json"
      - "generate_substack_status.py"

  schedule:
    # Every 6 hours.
    # New Naver posts also trigger this immediately through the push rule above.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: substack-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate Substack status
        run: |
          python generate_substack_status.py

      - name: Commit generated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SUBSTACK_STATUS.md substack_status.json substack_manifest.json

          if git diff --cached --quiet; then
            echo "No status changes."
            exit 0
          fi

          git commit -m "Update Naver-Substack publication status"

          # Reduce the chance of a push conflict with the Naver sync workflow.
          git pull --rebase origin main
          git push origin main
